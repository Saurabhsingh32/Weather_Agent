apiVersion: apps/v1
kind: Deployment
metadata:
  name: notes-api
  namespace: agentic-web-app
  labels:
    app: notes-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: notes-api
  template:
    metadata:
      labels:
        app: notes-api
    spec:
      containers:
        - name: notes-api
          image: ttl.sh/agentic-web-app-saurabh:2h
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: NOTES_DB_PATH
              value: /data/notes.db
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: notes-data
              mountPath: /data
      volumes:
        # Per-pod ephemeral SQLite. Shared multi-writer SQLite is not safe across replicas.
        - name: notes-data
          emptyDir: {}
